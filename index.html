<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUKEBOX</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue:#1A6FE8; --blue2:#3B8BFF; --bluedim:#D6E8FF;
  --bluebg:#EBF3FF; --white:#fff; --offwhite:#F4F7FF;
  --border:#B8D0F8; --text:#0D2A5C; --subtext:#5578A8;
  --sfx:#7C3AED; --sfxdim:#EDE9FE; --sfxbg:#F5F3FF; --sfxborder:#C4B5FD;
}
body { font-family:'Noto Sans KR',sans-serif; background:var(--offwhite); color:var(--text); min-height:100vh; }

/* LOBBY */
#lobby { display:flex; align-items:center; justify-content:center; min-height:100vh; }
.lobby-box { border:3px solid var(--blue); background:var(--white); padding:36px 40px; display:flex; flex-direction:column; gap:14px; min-width:340px; max-width:400px; width:100%; }
.lobby-logo { font-family:'DotGothic16',monospace; font-size:32px; color:var(--blue); letter-spacing:6px; text-shadow:3px 3px 0 #B8D0F8; text-align:center; margin-bottom:4px; }
.lobby-note { display:inline-block; animation:bn 1s infinite alternate; }
@keyframes bn { from{transform:translateY(0)} to{transform:translateY(-4px)} }
.lobby-sub { font-family:'DotGothic16',monospace; font-size:11px; color:var(--subtext); text-align:center; letter-spacing:2px; }
.lbl { font-family:'DotGothic16',monospace; font-size:11px; color:var(--subtext); letter-spacing:2px; margin-bottom:4px; }
.divider { border:none; border-top:2px dashed var(--bluedim); }
.tab-row { display:flex; gap:0; border:2px solid var(--blue); }
.tab-btn { flex:1; font-family:'DotGothic16',monospace; font-size:12px; padding:7px; border:none; background:var(--white); color:var(--subtext); cursor:pointer; letter-spacing:1px; transition:background .15s,color .15s; }
.tab-btn.active { background:var(--blue); color:#fff; }
.tab-panel { display:none; flex-direction:column; gap:10px; }
.tab-panel.active { display:flex; }

input.dot-input { font-family:'DotGothic16',monospace; font-size:12px; border:2px solid var(--border); background:var(--offwhite); color:var(--text); padding:7px 9px; outline:none; width:100%; letter-spacing:1px; }
input.dot-input:focus { border-color:var(--blue); background:var(--white); }
button.dot-btn { font-family:'DotGothic16',monospace; font-size:11px; border:2px solid var(--blue); background:var(--blue); color:#fff; padding:7px 12px; cursor:pointer; letter-spacing:1px; transition:background .15s; white-space:nowrap; }
button.dot-btn:hover { background:#0D4DB5; border-color:#0D4DB5; }
button.dot-btn.full { width:100%; }
button.dot-btn.outline { background:var(--white); color:var(--blue); }
button.dot-btn.outline:hover { background:var(--bluebg); }
button.dot-btn.danger { background:#e24b4a; border-color:#e24b4a; width:100%; }
button.dot-btn.sm { font-size:11px; padding:6px 10px; }
button.dot-btn.sfx-btn { border-color:var(--sfx); background:var(--sfx); }
button.dot-btn.sfx-btn:hover { background:#6D28D9; border-color:#6D28D9; }
button.dot-btn:disabled { opacity:.35; cursor:not-allowed; }
select.dot-select { font-family:'DotGothic16',monospace; font-size:11px; border:2px solid var(--border); background:var(--offwhite); color:var(--text); padding:5px 6px; outline:none; cursor:pointer; }
select.dot-select:focus { border-color:var(--blue); }

/* APP */
#app { display:none; flex-direction:column; min-height:100vh; }
.header { background:var(--blue); padding:0 20px; display:flex; align-items:center; justify-content:space-between; height:52px; border-bottom:3px solid #0D4DB5; flex-shrink:0; }
.logo { font-family:'DotGothic16',monospace; font-size:24px; color:#fff; letter-spacing:4px; text-shadow:3px 3px 0 #0D4DB5; user-select:none; }
.logo-note { display:inline-block; margin-right:6px; animation:bn 1s infinite alternate; }
.room-badge { font-family:'DotGothic16',monospace; font-size:12px; background:rgba(255,255,255,.2); color:#fff; border:2px solid rgba(255,255,255,.5); padding:3px 12px; letter-spacing:2px; }
.role-badge { font-family:'DotGothic16',monospace; font-size:11px; padding:3px 10px; border:2px solid #fff; color:#fff; background:transparent; letter-spacing:1px; }
.role-badge.gm { background:#fff; color:var(--blue); }

.main { display:grid; grid-template-columns:220px 1fr; flex:1; min-height:0; }
.sidebar { background:var(--white); border-right:2px solid var(--border); display:flex; flex-direction:column; overflow-y:auto; }
.sidebar-section { border-bottom:2px dashed var(--bluedim); padding:12px 14px; }
.sec-title { font-family:'DotGothic16',monospace; font-size:12px; color:var(--blue); letter-spacing:2px; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
.sec-title::before { content:''; display:inline-block; width:8px; height:8px; background:var(--blue); flex-shrink:0; }
.sec-title.sfx { color:var(--sfx); }
.sec-title.sfx::before { background:var(--sfx); }

.online-item { font-family:'DotGothic16',monospace; font-size:11px; padding:4px 6px; display:flex; align-items:center; gap:6px; }
.online-dot { width:7px; height:7px; border-radius:50%; background:#22c55e; flex-shrink:0; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.online-gm { font-size:10px; background:var(--bluedim); color:var(--blue); padding:1px 5px; border:1px solid var(--border); }

/* CONTENT */
.content { display:flex; flex-direction:column; padding:16px; gap:14px; overflow-y:auto; background:var(--offwhite); }

/* PLAYER CARDS */
.player-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }

.player-card { background:var(--white); padding:14px; border:2px solid var(--blue); }
.player-card.sfx-card { border-color:var(--sfx); }

.player-header { font-family:'DotGothic16',monospace; font-size:11px; letter-spacing:2px; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
.player-header .ph-dot { width:8px; height:8px; background:var(--blue); flex-shrink:0; }
.player-header.sfx { color:var(--sfx); }
.player-header.sfx .ph-dot { background:var(--sfx); }

.album-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.album-art { width:48px; height:48px; background:var(--bluedim); border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; position:relative; overflow:hidden; }
.album-art.sfx-art { background:var(--sfxdim); border-color:var(--sfxborder); }
.album-art .vinyl { position:absolute; width:28px; height:28px; border-radius:50%; border:2px solid var(--blue); background:var(--white); animation:spin 3s linear infinite; opacity:0; transition:opacity .3s; }
.album-art.sfx-art .vinyl { border-color:var(--sfx); }
.album-art.playing .vinyl { opacity:.5; }
@keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

.now-title { font-family:'DotGothic16',monospace; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:1px; margin-bottom:2px; }
.now-sub { font-size:10px; color:var(--subtext); }
.equalizer { display:flex; align-items:flex-end; gap:2px; height:14px; margin-top:5px; opacity:0; transition:opacity .3s; }
.equalizer.active { opacity:1; }
.eq-bar { width:3px; border-radius:1px; animation:eqb .5s infinite alternate; }
.eq-bar.bgm-bar { background:var(--blue); }
.eq-bar.sfx-bar { background:var(--sfx); }
.eq-bar:nth-child(2){animation-delay:.1s} .eq-bar:nth-child(3){animation-delay:.2s} .eq-bar:nth-child(4){animation-delay:.05s} .eq-bar:nth-child(5){animation-delay:.15s}
@keyframes eqb { from{height:3px} to{height:14px} }

.yt-wrap { display:none; margin-bottom:10px; }
.yt-wrap.visible { display:block; }
.yt-wrap iframe { width:100%; height:120px; border:2px solid var(--border); display:block; }
.yt-wrap.sfx-yt iframe { border-color:var(--sfxborder); }

.ctrl-row { display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:8px; }
.ctrl-btn { font-family:'DotGothic16',monospace; font-size:12px; width:30px; height:30px; border:2px solid var(--border); background:var(--offwhite); color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:border-color .15s,background .15s; }
.ctrl-btn:hover:not(:disabled) { border-color:var(--blue); background:var(--bluebg); color:var(--blue); }
.ctrl-btn.sfx-ctrl:hover:not(:disabled) { border-color:var(--sfx); background:var(--sfxbg); color:var(--sfx); }
.ctrl-btn.play-btn { width:38px; height:38px; border:2px solid var(--blue); background:var(--blue); color:#fff; font-size:14px; }
.ctrl-btn.play-btn:hover:not(:disabled) { background:#0D4DB5; }
.ctrl-btn.sfx-play { border-color:var(--sfx); background:var(--sfx); }
.ctrl-btn.sfx-play:hover:not(:disabled) { background:#6D28D9; border-color:#6D28D9; }
.ctrl-btn.on { color:var(--blue); border-color:var(--blue); background:var(--bluebg); }
.ctrl-btn.sfx-on { color:var(--sfx); border-color:var(--sfx); background:var(--sfxbg); }
.ctrl-btn:disabled { opacity:.35; cursor:not-allowed; }

.vol-row { display:flex; align-items:center; gap:5px; font-family:'DotGothic16',monospace; font-size:10px; color:var(--subtext); }
input[type=range] { flex:1; accent-color:var(--blue); }
input[type=range].sfx-range { accent-color:var(--sfx); }

/* ADD TRACK */
.add-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.add-card { border:2px dashed var(--border); background:var(--white); padding:12px; }
.add-card.sfx-add { border-color:var(--sfxborder); }
.add-card .row { display:flex; gap:6px; margin-top:7px; flex-wrap:wrap; }

/* QUEUE */
.queue-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.queue-card { border:2px solid var(--border); background:var(--white); }
.queue-card.sfx-queue { border-color:var(--sfxborder); }
.queue-header { padding:8px 12px; background:var(--bluebg); border-bottom:2px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px; }
.queue-header.sfx-qh { background:var(--sfxbg); border-color:var(--sfxborder); }
.track-row { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px dashed var(--bluedim); cursor:pointer; transition:background .15s; }
.track-row.sfx-row { border-bottom-color:var(--sfxdim); }
.track-row:last-child { border-bottom:none; }
.track-row:hover { background:var(--bluebg); }
.track-row.sfx-row:hover { background:var(--sfxbg); }
.track-row.playing { background:var(--bluedim); }
.track-row.sfx-playing { background:var(--sfxdim); }
.track-num { font-family:'DotGothic16',monospace; font-size:10px; color:var(--subtext); min-width:16px; text-align:center; }
.track-row.playing .track-num { color:var(--blue); }
.track-row.sfx-playing .track-num { color:var(--sfx); }
.track-thumb { width:28px; height:28px; background:var(--bluedim); border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0; }
.track-thumb.sfx-thumb { background:var(--sfxdim); border-color:var(--sfxborder); }
.track-row.playing .track-thumb { border-color:var(--blue); }
.track-row.sfx-playing .track-thumb { border-color:var(--sfx); }
.track-info { flex:1; min-width:0; }
.track-name { font-size:11px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.track-row.playing .track-name { color:var(--blue); }
.track-row.sfx-playing .track-name { color:var(--sfx); }
.track-tag { font-family:'DotGothic16',monospace; font-size:10px; color:var(--subtext); }
.x-btn { font-size:10px; color:#ccc; cursor:pointer; flex-shrink:0; padding:2px 3px; }
.x-btn:hover { color:#e24b4a; }
.empty-queue { font-family:'DotGothic16',monospace; font-size:11px; color:var(--subtext); text-align:center; padding:20px; }

.folder-item { display:flex; align-items:center; gap:5px; margin-bottom:4px; }
.folder-name-box { font-family:'DotGothic16',monospace; font-size:10px; flex:1; padding:4px 7px; border:2px solid var(--border); background:var(--offwhite); }
.folder-name-box.sfx-folder { border-color:var(--sfxborder); }
.share-box { background:var(--bluedim); border:2px solid var(--border); padding:7px 10px; font-family:'DotGothic16',monospace; font-size:10px; color:var(--blue); letter-spacing:1px; word-break:break-all; cursor:pointer; }
.share-box:hover { background:var(--bluebg); }

.toast { position:fixed; bottom:20px; right:20px; font-family:'DotGothic16',monospace; font-size:12px; background:var(--blue); color:#fff; padding:10px 18px; border:2px solid #0D4DB5; opacity:0; transform:translateY(10px); transition:opacity .3s,transform .3s; z-index:999; pointer-events:none; }
.toast.show { opacity:1; transform:translateY(0); }
</style>
</head>
<body>

<!-- LOBBY -->
<div id="lobby">
  <div class="lobby-box">
    <div class="lobby-logo"><span class="lobby-note">♪</span> JUKEBOX</div>
    <div class="lobby-sub">CoC TRPG 실시간 음악 공유</div>
    <hr class="divider">
    <div><div class="lbl">닉네임</div><input class="dot-input" id="lobbyNick" placeholder="닉네임 입력..." maxlength="16"></div>
    <div class="tab-row">
      <button class="tab-btn active" onclick="switchTab('guest')">GUEST 입장</button>
      <button class="tab-btn" onclick="switchTab('gm')">GM 입장</button>
    </div>
    <div class="tab-panel active" id="tabGuest">
      <div><div class="lbl">방 코드</div><input class="dot-input" id="guestCode" placeholder="방 코드 입력... 예) COCROOM" maxlength="20" style="text-transform:uppercase;"></div>
      <button class="dot-btn full outline" onclick="joinGuest()">입장하기 ▷</button>
    </div>
    <div class="tab-panel" id="tabGM">
      <div><div class="lbl">방 코드 (직접 정하기)</div><input class="dot-input" id="gmCode" placeholder="예) COCROOM, TRPG01..." maxlength="20" style="text-transform:uppercase;"></div>
      <div><div class="lbl">GM 비밀번호</div><input class="dot-input" id="gmPw" type="password" placeholder="비밀번호 설정 (방 없으면 생성)"></div>
      <button class="dot-btn full" onclick="joinGM()">GM으로 입장 ▷</button>
      <div style="font-family:'DotGothic16',monospace;font-size:10px;color:var(--subtext);">* 방이 없으면 새로 만들어요. 있으면 비밀번호 확인.</div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header class="header">
    <div class="logo"><span class="logo-note">♪</span>JUKEBOX</div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="room-badge" id="headerRoomCode"></div>
      <div class="role-badge" id="headerRole"></div>
    </div>
  </header>

  <div class="main">
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="sec-title">방 정보</div>
        <div style="font-family:'DotGothic16',monospace;font-size:12px;margin-bottom:7px;" id="sideRoomCode"></div>
        <div class="lbl" style="margin-bottom:4px;">초대 링크</div>
        <div class="share-box" id="shareBox" onclick="copyShare()"></div>
        <div style="font-family:'DotGothic16',monospace;font-size:10px;color:var(--subtext);margin-top:3px;">클릭하면 복사</div>
      </div>
      <div class="sidebar-section">
        <div class="sec-title">접속자</div>
        <div id="onlineList"></div>
      </div>
      <!-- BGM 폴더 -->
      <div class="sidebar-section">
        <div class="sec-title">BGM 폴더</div>
        <div id="bgmFolderList"></div>
        <div style="display:flex;gap:5px;margin-top:6px;" id="gmBgmFolderAdd">
          <input class="dot-input" id="newBgmFolder" placeholder="폴더명..." maxlength="14" style="font-size:10px;">
          <button class="dot-btn sm" onclick="addFolder('bgm')">+</button>
        </div>
      </div>
      <!-- SFX 폴더 -->
      <div class="sidebar-section" style="flex:1;">
        <div class="sec-title sfx">SFX 폴더</div>
        <div id="sfxFolderList"></div>
        <div style="display:flex;gap:5px;margin-top:6px;" id="gmSfxFolderAdd">
          <input class="dot-input" id="newSfxFolder" placeholder="폴더명..." maxlength="14" style="font-size:10px;">
          <button class="dot-btn sm sfx-btn" onclick="addFolder('sfx')">+</button>
        </div>
      </div>
      <div class="sidebar-section">
        <button class="dot-btn danger" onclick="leaveRoom()">방 나가기</button>
      </div>
    </aside>

    <main class="content">
      <!-- PLAYERS -->
      <div class="player-grid">
        <!-- BGM -->
        <div class="player-card" id="bgmCard">
          <div class="player-header"><div class="ph-dot"></div>BGM</div>
          <div class="album-row">
            <div class="album-art" id="bgmArt"><span>♪</span><div class="vinyl"></div></div>
            <div style="flex:1;min-width:0;">
              <div class="now-title" id="bgmTitle">-- 선택 없음 --</div>
              <div class="now-sub" id="bgmSub"></div>
              <div class="equalizer" id="bgmEq">
                <div class="eq-bar bgm-bar" style="height:4px"></div>
                <div class="eq-bar bgm-bar" style="height:8px"></div>
                <div class="eq-bar bgm-bar" style="height:5px"></div>
                <div class="eq-bar bgm-bar" style="height:10px"></div>
                <div class="eq-bar bgm-bar" style="height:4px"></div>
              </div>
            </div>
          </div>
          <div class="yt-wrap" id="bgmYtWrap"><div id="bgm-yt-player"></div></div>
          <div class="ctrl-row">
            <button class="ctrl-btn" id="bgmShuffle" onclick="gmAct('bgm','shuffle')" title="셔플">⇄</button>
            <button class="ctrl-btn" id="bgmPrev" onclick="gmAct('bgm','prev')">◁◁</button>
            <button class="ctrl-btn play-btn" id="bgmPlay" onclick="gmAct('bgm','toggle')">▶</button>
            <button class="ctrl-btn" id="bgmNext" onclick="gmAct('bgm','next')">▷▷</button>
            <button class="ctrl-btn" id="bgmRepeat" onclick="gmAct('bgm','repeat')" title="반복">↺</button>
          </div>
          <div class="vol-row">♪ <input type="range" min="0" max="100" value="70" step="1" id="bgmVol" oninput="setVol('bgm',this.value)"></div>
        </div>

        <!-- SFX -->
        <div class="player-card sfx-card" id="sfxCard">
          <div class="player-header sfx"><div class="ph-dot"></div>SFX / 효과음</div>
          <div class="album-row">
            <div class="album-art sfx-art" id="sfxArt"><span>★</span><div class="vinyl"></div></div>
            <div style="flex:1;min-width:0;">
              <div class="now-title" id="sfxTitle">-- 선택 없음 --</div>
              <div class="now-sub" id="sfxSub"></div>
              <div class="equalizer" id="sfxEq">
                <div class="eq-bar sfx-bar" style="height:4px"></div>
                <div class="eq-bar sfx-bar" style="height:8px"></div>
                <div class="eq-bar sfx-bar" style="height:5px"></div>
                <div class="eq-bar sfx-bar" style="height:10px"></div>
                <div class="eq-bar sfx-bar" style="height:4px"></div>
              </div>
            </div>
          </div>
          <div class="yt-wrap sfx-yt" id="sfxYtWrap"><div id="sfx-yt-player"></div></div>
          <div class="ctrl-row">
            <button class="ctrl-btn sfx-ctrl" id="sfxPrev" onclick="gmAct('sfx','prev')">◁◁</button>
            <button class="ctrl-btn play-btn sfx-play" id="sfxPlay" onclick="gmAct('sfx','toggle')">▶</button>
            <button class="ctrl-btn sfx-ctrl" id="sfxNext" onclick="gmAct('sfx','next')">▷▷</button>
            <button class="ctrl-btn sfx-ctrl" id="sfxStop" onclick="gmAct('sfx','stop')" title="정지">■</button>
          </div>
          <div class="vol-row">★ <input type="range" class="sfx-range" min="0" max="100" value="80" step="1" id="sfxVol" oninput="setVol('sfx',this.value)"></div>
        </div>
      </div>

      <!-- ADD TRACKS -->
      <div class="add-grid" id="addSection">
        <div class="add-card">
          <div class="sec-title" style="margin-bottom:6px;">+ BGM 추가</div>
          <input class="dot-input" id="bgmUrl" placeholder="YouTube URL...">
          <div class="row">
            <input class="dot-input" id="bgmTrackTitle" placeholder="제목 (선택)" style="flex:1;">
            <select class="dot-select" id="bgmTrackFolder"></select>
            <button class="dot-btn sm" onclick="addTrack('bgm')">추가</button>
          </div>
        </div>
        <div class="add-card sfx-add">
          <div class="sec-title sfx" style="margin-bottom:6px;">+ SFX 추가</div>
          <input class="dot-input" id="sfxUrl" placeholder="YouTube URL...">
          <div class="row">
            <input class="dot-input" id="sfxTrackTitle" placeholder="제목 (선택)" style="flex:1;">
            <select class="dot-select" id="sfxTrackFolder"></select>
            <button class="dot-btn sm sfx-btn" onclick="addTrack('sfx')">추가</button>
          </div>
        </div>
      </div>

      <!-- QUEUES -->
      <div class="queue-grid">
        <!-- BGM Queue -->
        <div class="queue-card">
          <div class="queue-header">
            <div class="sec-title" style="margin:0;">♪ BGM <span id="bgmCount" style="font-size:10px;color:var(--subtext);margin-left:3px;"></span></div>
            <div style="display:flex;gap:5px;align-items:center;">
              <select class="dot-select" id="bgmFilter" onchange="renderQueues()"><option value="">전체</option></select>
              <button class="dot-btn sm outline" onclick="clearTracks('bgm')" id="gmBgmClear">삭제</button>
            </div>
          </div>
          <div id="bgmQueueList"></div>
        </div>
        <!-- SFX Queue -->
        <div class="queue-card sfx-queue">
          <div class="queue-header sfx-qh">
            <div class="sec-title sfx" style="margin:0;">★ SFX <span id="sfxCount" style="font-size:10px;color:var(--subtext);margin-left:3px;"></span></div>
            <div style="display:flex;gap:5px;align-items:center;">
              <select class="dot-select" id="sfxFilter" onchange="renderQueues()"><option value="">전체</option></select>
              <button class="dot-btn sm outline" onclick="clearTracks('sfx')" id="gmSfxClear">삭제</button>
            </div>
          </div>
          <div id="sfxQueueList"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue, off, update, remove, onDisconnect }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAXNOxWpvkbf0l8X4EuccVxwH5KCOlIWVo",
  authDomain: "jukeboxc-41466.firebaseapp.com",
  databaseURL: "https://jukeboxc-41466-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "jukeboxc-41466",
  storageBucket: "jukeboxc-41466.firebasestorage.app",
  messagingSenderId: "83618301241",
  appId: "1:83618301241:web:20b83753ed89cb3b9614e8"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);

let S = { roomCode:null, nick:null, role:null, uid:null };
let cached = { bgmTracks:[], sfxTracks:[], bgmPS:{}, sfxPS:{}, bgmFolders:[], sfxFolders:[] };
let lastIdx = { bgm:-1, sfx:-1 };
let unsubRoom = null;

// YT Players
let yt = { bgm:null, sfx:null };
let ytReady = { bgm:false, sfx:false };
let pending = { bgm:null, sfx:null, bgmSeek:0, sfxSeek:0 };

window.onYouTubeIframeAPIReady = function() {
  yt.bgm = new YT.Player('bgm-yt-player', {
    height:'120', width:'100%',
    playerVars:{ autoplay:0, rel:0, modestbranding:1 },
    events:{
      onReady(){ ytReady.bgm=true; if(pending.bgm){_load('bgm',pending.bgm,pending.bgmSeek);pending.bgm=null;} },
      onStateChange(e){
        if(e.data===1) setUI('bgm',true);
        if(e.data===2) setUI('bgm',false);
        if(e.data===0&&S.role==='GM'){
          if(cached.bgmPS.repeat) syncWrite('bgm',{playing:true,seekTime:0});
          else gmAct('bgm','next');
        }
      },
      onError(){ showToast('BGM: 임베드 차단 영상!'); setUI('bgm',false); }
    }
  });
  yt.sfx = new YT.Player('sfx-yt-player', {
    height:'120', width:'100%',
    playerVars:{ autoplay:0, rel:0, modestbranding:1 },
    events:{
      onReady(){ ytReady.sfx=true; if(pending.sfx){_load('sfx',pending.sfx,pending.sfxSeek);pending.sfx=null;} },
      onStateChange(e){
        if(e.data===1) setUI('sfx',true);
        if(e.data===2||e.data===0) setUI('sfx',false);
      },
      onError(){ showToast('SFX: 임베드 차단 영상!'); setUI('sfx',false); }
    }
  });
};
(function(){ const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s); })();

function _load(type, vid, seek) {
  document.getElementById(type==='bgm'?'bgmYtWrap':'sfxYtWrap').classList.add('visible');
  const p = yt[type];
  if(p&&p.loadVideoById) p.loadVideoById({videoId:vid,startSeconds:seek||0});
  else { pending[type]=vid; pending[type+'Seek']=seek||0; }
}

window.setVol = function(type, v) {
  const p=yt[type]; if(p&&p.setVolume) p.setVolume(parseInt(v));
};

// utils
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }
function extractYtId(url){ const m=url.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m?m[1]:null; }
function hashPw(pw){ let h=0; for(let i=0;i<pw.length;i++){h=((h<<5)-h)+pw.charCodeAt(i);h|=0;} return 'h'+Math.abs(h).toString(36); }

// LOBBY
window.switchTab = function(tab) {
  document.getElementById('tabGuest').classList.toggle('active',tab==='guest');
  document.getElementById('tabGM').classList.toggle('active',tab==='gm');
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',(tab==='guest'&&i===0)||(tab==='gm'&&i===1)));
};
const urlCode = new URLSearchParams(location.search).get('room');
if(urlCode) document.getElementById('guestCode').value=urlCode.toUpperCase();

window.joinGuest = async function() {
  const nick=document.getElementById('lobbyNick').value.trim();
  const code=document.getElementById('guestCode').value.trim().toUpperCase();
  if(!nick){showToast('닉네임을 입력해줘요!');return;}
  if(!code){showToast('방 코드를 입력해줘요!');return;}
  const snap=await get(ref(db,`rooms/${code}`));
  if(!snap.exists()){showToast('존재하지 않는 방 코드예요!');return;}
  S={roomCode:code,nick,role:'GUEST',uid:'u_'+Date.now()};
  enterApp();
};

window.joinGM = async function() {
  const nick=document.getElementById('lobbyNick').value.trim();
  const code=document.getElementById('gmCode').value.trim().toUpperCase();
  const pw=document.getElementById('gmPw').value;
  if(!nick){showToast('닉네임을 입력해줘요!');return;}
  if(!code){showToast('방 코드를 입력해줘요!');return;}
  if(!pw){showToast('GM 비밀번호를 입력해줘요!');return;}
  const snap=await get(ref(db,`rooms/${code}`));
  if(!snap.exists()){
    await set(ref(db,`rooms/${code}`),{
      gmPwHash:hashPw(pw),
      bgmPS:{playing:false,currentIdx:-1,shuffle:false,repeat:true,seekTime:0},
      sfxPS:{playing:false,currentIdx:-1,seekTime:0},
      bgmFolders:['긴장','분위기','일상'],
      sfxFolders:['효과음','앰비언스'],
      bgmTracks:{}, sfxTracks:{}
    });
    showToast('✨ 방을 새로 만들었어요!');
  } else {
    if(snap.val().gmPwHash!==hashPw(pw)){showToast('GM 비밀번호가 틀렸어요!');return;}
  }
  S={roomCode:code,nick,role:'GM',uid:'u_'+Date.now()};
  enterApp();
};

function enterApp() {
  document.getElementById('lobby').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('headerRoomCode').textContent=S.roomCode;
  document.getElementById('headerRole').textContent=S.role;
  document.getElementById('headerRole').className='role-badge'+(S.role==='GM'?' gm':'');
  document.getElementById('sideRoomCode').textContent='방 코드: '+S.roomCode;
  const shareUrl=location.origin+location.pathname+'?room='+S.roomCode;
  document.getElementById('shareBox').textContent=shareUrl;

  ['addSection','gmBgmFolderAdd','gmSfxFolderAdd','gmBgmClear','gmSfxClear'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.style.display=S.role==='GM'?'':'none';
  });
  if(S.role==='GUEST'){
    ['bgmShuffle','bgmPrev','bgmPlay','bgmNext','bgmRepeat','sfxPrev','sfxPlay','sfxNext','sfxStop'].forEach(id=>{
      const el=document.getElementById(id); if(el) el.disabled=true;
    });
  }

  const presRef=ref(db,`rooms/${S.roomCode}/presence/${S.uid}`);
  set(presRef,{nick:S.nick,role:S.role,online:true});
  onDisconnect(presRef).remove();

  unsubRoom=onValue(ref(db,`rooms/${S.roomCode}`),snap=>{
    if(!snap.exists()){showToast('방이 삭제됐어요.');leaveRoom();return;}
    const d=snap.val();
    cached.bgmTracks=Object.entries(d.bgmTracks||{}).map(([k,v])=>({...v,key:k})).sort((a,b)=>(a.order||0)-(b.order||0));
    cached.sfxTracks=Object.entries(d.sfxTracks||{}).map(([k,v])=>({...v,key:k})).sort((a,b)=>(a.order||0)-(b.order||0));
    cached.bgmPS=d.bgmPS||{};
    cached.sfxPS=d.sfxPS||{};
    cached.bgmFolders=d.bgmFolders||[];
    cached.sfxFolders=d.sfxFolders||[];
    renderFolders();
    renderQueues();
    applyPS('bgm');
    applyPS('sfx');
    renderOnline(d.presence||{});
  });
}

window.leaveRoom = function() {
  if(unsubRoom){off(ref(db,`rooms/${S.roomCode}`));unsubRoom=null;}
  if(S.uid&&S.roomCode) remove(ref(db,`rooms/${S.roomCode}/presence/${S.uid}`));
  ['bgm','sfx'].forEach(t=>{ if(yt[t]&&yt[t].stopVideo) yt[t].stopVideo(); document.getElementById(t==='bgm'?'bgmYtWrap':'sfxYtWrap').classList.remove('visible'); });
  document.getElementById('app').style.display='none';
  document.getElementById('lobby').style.display='flex';
  lastIdx={bgm:-1,sfx:-1}; cached={bgmTracks:[],sfxTracks:[],bgmPS:{},sfxPS:{},bgmFolders:[],sfxFolders:[]};
  S={roomCode:null,nick:null,role:null,uid:null};
};

window.copyShare = function() {
  const t=document.getElementById('shareBox').textContent;
  navigator.clipboard.writeText(t).then(()=>showToast('📋 링크 복사됨!')).catch(()=>showToast('직접 복사해주세요'));
};

function renderOnline(presence) {
  const list=document.getElementById('onlineList'); list.innerHTML='';
  Object.values(presence).forEach(p=>{
    const d=document.createElement('div'); d.className='online-item';
    d.innerHTML=`<div class="online-dot"></div><span style="font-family:'DotGothic16',monospace;font-size:11px;">${esc(p.nick)}</span>`+(p.role==='GM'?'<span class="online-gm">GM</span>':'');
    list.appendChild(d);
  });
}

// FOLDERS
function renderFolders() {
  renderFolderList('bgm', cached.bgmFolders);
  renderFolderList('sfx', cached.sfxFolders);
  renderFolderSelects();
}
function renderFolderList(type, folders) {
  const listId = type==='bgm'?'bgmFolderList':'sfxFolderList';
  const list=document.getElementById(listId); list.innerHTML='';
  folders.forEach(f=>{
    const d=document.createElement('div'); d.className='folder-item';
    d.innerHTML=`<div class="folder-name-box${type==='sfx'?' sfx-folder':''}">${esc(f)}</div>`
      +(S.role==='GM'?`<span class="x-btn">✕</span>`:'');
    if(S.role==='GM') d.querySelector('.x-btn').onclick=()=>deleteFolder(type,f);
    list.appendChild(d);
  });
}
window.addFolder = function(type) {
  const inputId=type==='bgm'?'newBgmFolder':'newSfxFolder';
  const name=document.getElementById(inputId).value.trim(); if(!name)return;
  const key=type==='bgm'?'bgmFolders':'sfxFolders';
  const folders=[...cached[key==='bgmFolders'?'bgmFolders':'sfxFolders']];
  if(folders.includes(name)){showToast('이미 있는 폴더!');return;}
  folders.push(name);
  update(ref(db,`rooms/${S.roomCode}`),{[key]:folders});
  document.getElementById(inputId).value='';
};
function deleteFolder(type,name) {
  const key=type==='bgm'?'bgmFolders':'sfxFolders';
  const folders=(cached[key]||[]).filter(f=>f!==name);
  update(ref(db,`rooms/${S.roomCode}`),{[key]:folders});
}
function renderFolderSelects() {
  [['bgmTrackFolder','bgmFolders'],['sfxTrackFolder','sfxFolders'],['bgmFilter','bgmFolders'],['sfxFilter','sfxFolders']].forEach(([id,fkey])=>{
    const sel=document.getElementById(id), cur=sel.value;
    const isFilter=id.includes('Filter');
    while(sel.options.length>(isFilter?1:0)) sel.remove(isFilter?1:0);
    if(!isFilter){const o=document.createElement('option');o.value='';o.textContent='폴더 없음';sel.appendChild(o);}
    (cached[fkey]||[]).forEach(f=>{const o=document.createElement('option');o.value=f;o.textContent=f;sel.appendChild(o);});
    if(cur) sel.value=cur;
  });
}

// TRACKS
window.addTrack = function(type) {
  const urlId=type==='bgm'?'bgmUrl':'sfxUrl';
  const titleId=type==='bgm'?'bgmTrackTitle':'sfxTrackTitle';
  const folderId=type==='bgm'?'bgmTrackFolder':'sfxTrackFolder';
  const url=document.getElementById(urlId).value.trim();
  const title=document.getElementById(titleId).value.trim();
  const folder=document.getElementById(folderId).value;
  const ytId=extractYtId(url);
  if(!ytId){showToast('유효한 YouTube URL을 입력하세요!');return;}
  const tracks=type==='bgm'?cached.bgmTracks:cached.sfxTracks;
  const newTitle=title||(type==='bgm'?'BGM ':'SFX ')+(tracks.length+1);
  const key=type+'_'+Date.now();
  set(ref(db,`rooms/${S.roomCode}/${type}Tracks/${key}`),{ytId,title:newTitle,folder,order:tracks.length});
  document.getElementById(urlId).value='';
  document.getElementById(titleId).value='';
  showToast('♪ 트랙 추가됨!');
};

window.renderQueues = function() {
  renderQ('bgm'); renderQ('sfx');
};
function renderQ(type) {
  const tracks=type==='bgm'?cached.bgmTracks:cached.sfxTracks;
  const ps=type==='bgm'?cached.bgmPS:cached.sfxPS;
  const filter=document.getElementById(type==='bgm'?'bgmFilter':'sfxFilter').value;
  const shown=filter?tracks.filter(t=>t.folder===filter):tracks;
  const curIdx=ps.currentIdx??-1;
  document.getElementById(type==='bgm'?'bgmCount':'sfxCount').textContent='('+shown.length+')';
  const list=document.getElementById(type==='bgm'?'bgmQueueList':'sfxQueueList');
  list.innerHTML='';
  if(!shown.length){list.innerHTML=`<div class="empty-queue">트랙 없음</div>`;return;}
  shown.forEach((track,i)=>{
    const gi=tracks.indexOf(track);
    const isPlaying=gi===curIdx;
    const row=document.createElement('div');
    row.className=`track-row${type==='sfx'?' sfx-row':''}${isPlaying?(type==='sfx'?' sfx-playing':' playing'):''}`;
    row.innerHTML=`<span class="track-num">${isPlaying?'♪':(i+1)}</span>`
      +`<div class="track-thumb${type==='sfx'?' sfx-thumb':''}">▶</div>`
      +`<div class="track-info"><div class="track-name">${esc(track.title)}</div><div class="track-tag">${esc(track.folder||'폴더 없음')}</div></div>`
      +(S.role==='GM'?`<span class="x-btn">✕</span>`:'');
    if(S.role==='GM') row.querySelector('.x-btn').onclick=e=>{e.stopPropagation();remove(ref(db,`rooms/${S.roomCode}/${type}Tracks/${track.key}`));};
    row.onclick=e=>{if(e.target.classList.contains('x-btn'))return;if(S.role==='GM')syncWrite(type,{playing:true,currentIdx:gi,seekTime:0});};
    list.appendChild(row);
  });
}

window.clearTracks = function(type) {
  if(!confirm(type.toUpperCase()+' 큐 전부 삭제?'))return;
  set(ref(db,`rooms/${S.roomCode}/${type}Tracks`),{});
  syncWrite(type,{playing:false,currentIdx:-1,seekTime:0});
};

// PLAYSTATE
function syncWrite(type,partial) {
  update(ref(db,`rooms/${S.roomCode}/${type}PS`),partial);
}

function applyPS(type) {
  const ps=type==='bgm'?cached.bgmPS:cached.sfxPS;
  const tracks=type==='bgm'?cached.bgmTracks:cached.sfxTracks;
  const idx=ps.currentIdx??-1, playing=ps.playing??false;

  if(type==='bgm'){
    document.getElementById('bgmShuffle').classList.toggle('on',ps.shuffle??false);
    document.getElementById('bgmRepeat').classList.toggle('on',ps.repeat??true);
    document.getElementById('bgmPlay').textContent=playing?'⏸':'▶';
  } else {
    document.getElementById('sfxPlay').textContent=playing?'⏸':'▶';
  }
  setUI(type,playing);

  if(idx>=0&&idx<tracks.length){
    const track=tracks[idx];
    document.getElementById(type==='bgm'?'bgmTitle':'sfxTitle').textContent=track.title;
    document.getElementById(type==='bgm'?'bgmSub':'sfxSub').textContent=track.folder||'폴더 없음';
    if(idx!==lastIdx[type]){
      lastIdx[type]=idx;
      _load(type,track.ytId,ps.seekTime||0);
      if(!playing) setTimeout(()=>{ const p=yt[type]; if(p&&p.pauseVideo) p.pauseVideo(); },1200);
    } else {
      const p=yt[type];
      if(p&&p.getPlayerState){
        const ys=p.getPlayerState();
        if(playing&&ys!==1) p.playVideo();
        if(!playing&&ys===1) p.pauseVideo();
      }
    }
  } else if(idx===-1){
    lastIdx[type]=-1;
    document.getElementById(type==='bgm'?'bgmTitle':'sfxTitle').textContent='-- 선택 없음 --';
    document.getElementById(type==='bgm'?'bgmSub':'sfxSub').textContent='';
  }
}

function setUI(type,playing) {
  document.getElementById(type==='bgm'?'bgmArt':'sfxArt').classList.toggle('playing',playing);
  document.getElementById(type==='bgm'?'bgmEq':'sfxEq').classList.toggle('active',playing);
}

// GM ACTIONS
window.gmAct = function(type,action) {
  if(S.role!=='GM')return;
  const ps=type==='bgm'?cached.bgmPS:cached.sfxPS;
  const tracks=type==='bgm'?cached.bgmTracks:cached.sfxTracks;
  const cur=ps.currentIdx??-1, playing=ps.playing??false;
  if(action==='toggle'){
    if(cur<0&&tracks.length){syncWrite(type,{playing:true,currentIdx:0,seekTime:0});return;}
    syncWrite(type,{playing:!playing});
  }
  if(action==='next'){
    if(!tracks.length)return;
    const next=(ps.shuffle??false)?Math.floor(Math.random()*tracks.length):(cur+1)%tracks.length;
    syncWrite(type,{playing:true,currentIdx:next,seekTime:0});
  }
  if(action==='prev'){
    if(!tracks.length)return;
    syncWrite(type,{playing:true,currentIdx:cur<=0?tracks.length-1:cur-1,seekTime:0});
  }
  if(action==='shuffle') syncWrite(type,{shuffle:!(ps.shuffle??false)});
  if(action==='repeat')  syncWrite(type,{repeat:!(ps.repeat??true)});
  if(action==='stop')    syncWrite(type,{playing:false});
};
</script>
</body>
</html>
